[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "case-sdk"
version = "0.1.0"
description = "Dual-mode runtime for desktop GUI automation. Local procedures free, paid procedures stream from the case-api server."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "FSL-1.1-Apache-2.0" }
authors = [
    { name = "Case" },
]
keywords = [
    "automation",
    "gui",
    "pyautogui",
    "accessibility",
    "macos",
    "agent",
    "procedure",
]
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Operating System :: MacOS",
    "Development Status :: 3 - Alpha",
    "License :: Other/Proprietary License",
    "Intended Audience :: Developers",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Topic :: System :: Operating System Kernels",
]
dependencies = [
    "websockets>=12.0",
    "pydantic>=2.0",
    "pyautogui>=0.9.53",
    "atomacos>=3.3.0",
]

[project.optional-dependencies]
mcp = [
    "mcp[cli]>=1.0",
]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "fastapi>=0.110",
    "uvicorn>=0.27",
    "mcp[cli]>=1.0",
]

[project.scripts]
case-sdk = "case_sdk.cli:main"
case-mcp = "case_mcp.server:main"

[tool.hatch.build.targets.wheel]
packages = ["case_sdk", "case_mcp"]

[tool.hatch.build.targets.wheel.force-include]
"case_sdk/builtin_procedures" = "case_sdk/builtin_procedures"
