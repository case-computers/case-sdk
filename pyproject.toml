[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "case-sdk"
version = "0.1.0"
description = "Runtime for desktop GUI automation on macOS. Run procedures locally, or stream them from a remote WebSocket server."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "Elastic-2.0" }
authors = [
    { name = "DaemonLabs" },
]
keywords = [
    "automation",
    "gui",
    "pyautogui",
    "accessibility",
    "macos",
    "agent",
    "procedure",
]
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Operating System :: MacOS",
    "Development Status :: 3 - Alpha",
    "License :: Other/Proprietary License",
    "Intended Audience :: Developers",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Topic :: System :: Operating System Kernels",
]
dependencies = [
    "websockets>=12.0",
    "pydantic>=2.0",
    # macOS-only deps gated by sys_platform so non-mac consumers (case-api on
    # linux Cloud Run, CI containers) can install case-sdk for its protocol +
    # steps modules without pulling in the GUI stack. On macOS this resolves
    # exactly as before. atomacos 3.3.0 pins pyautogui<0.9.42; we only use
    # stable primitives that have been in pyautogui since 0.9.36.
    'pyautogui<0.9.42; sys_platform == "darwin"',
    'atomacos>=3.3.0; sys_platform == "darwin"',
]

[project.optional-dependencies]
mcp = [
    "mcp[cli]>=1.0",
]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "fastapi>=0.110",
    "uvicorn>=0.27",
    "mcp[cli]>=1.0",
]

[project.scripts]
case-sdk = "case_sdk.cli:main"
case-mcp = "case_mcp.server:main"

[tool.hatch.build.targets.wheel]
packages = ["case_sdk", "case_mcp"]
