[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "case-sdk"
version = "0.1.3"
description = "Runtime for desktop GUI automation on macOS. Run procedures locally, or stream them from a remote WebSocket server."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "Elastic-2.0" }
authors = [
    { name = "DaemonLabs" },
]
keywords = [
    "automation",
    "gui",
    "pyautogui",
    "accessibility",
    "macos",
    "agent",
    "procedure",
]
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Operating System :: MacOS",
    "Development Status :: 3 - Alpha",
    "License :: Other/Proprietary License",
    "Intended Audience :: Developers",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Topic :: System :: Operating System Kernels",
]
dependencies = [
    "websockets>=13.1",
    # Bundled CA bundle for wss:// TLS — sidesteps broken trust stores on python.org / pyenv builds.
    "certifi>=2024.0",
    # floor lifted for stability; email-validator is the actual CVE-2024-3772 dep if you opt into pydantic[email]
    "pydantic>=2.4",
    # macOS-only GUI deps; atomacos 3.3.0 pins pyautogui<0.9.42 and we only use primitives stable since 0.9.36.
    'pyautogui<0.9.42; sys_platform == "darwin"',
    'atomacos>=3.3.0; sys_platform == "darwin"',
    # Floor unconditional so Linux consumers don't pick up older vulnerable Pillow via transitive resolution (CVE-2024-28219, CVE-2025-48379).
    "Pillow>=11.3",
]

[project.urls]
Homepage = "https://daemonlabs.run"

[project.optional-dependencies]
mcp = [
    "mcp[cli]>=1.0",
]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "fastapi>=0.110",
    "uvicorn>=0.27",
    "mcp[cli]>=1.0",
]

[project.scripts]
case-sdk = "case_sdk.cli:main"
case-mcp = "case_mcp.server:main"

[tool.hatch.build.targets.wheel]
packages = ["case_sdk", "case_mcp"]
